---
deployment:
  tasks:
    # Deploy target: public_html is the Laravel project root on this server
    - export DEPLOYPATH=/home/mmobile2/public_html/

    # Use deploy SSH key for git
    - export GIT_SSH_COMMAND="ssh -i /home/mmobile2/.ssh/github_deploy -o StrictHostKeyChecking=no"

    # Pull latest changes from GitHub
    - cd $DEPLOYPATH && git reset --hard HEAD
    - cd $DEPLOYPATH && git pull origin main

    # Install/update Composer dependencies (no dev)
    - cd $DEPLOYPATH && /usr/local/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction --quiet

    # Clear and rebuild caches
    - cd $DEPLOYPATH && /usr/local/bin/php artisan config:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan route:cache
    - cd $DEPLOYPATH && /usr/local/bin/php artisan view:cache

    # Run database migrations
    - cd $DEPLOYPATH && /usr/local/bin/php artisan migrate --force

    # Fix permissions
    - chmod -R 775 $DEPLOYPATH/storage $DEPLOYPATH/bootstrap/cache

    # Storage symlink
    - cd $DEPLOYPATH && /usr/local/bin/php artisan storage:link 2>/dev/null || true
